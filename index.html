<!doctype html>
<html lang="zh-cn">

<head>
  <meta charset="UTF-8" />
  <!-- Register synchronously, before Wallpaper Engine sends its initial settings. -->
  <script src="./wallpaper-properties.js"></script>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="node_modules/@applemusic-like-lyrics/core/dist/style/lyric-player.module.css" />
  <link rel="stylesheet" href="/src/css/main.css" media="(aspect-ratio > 1/1)" />
  <link rel="stylesheet" href="/src/css/main_mobile.css" media="(aspect-ratio <= 1/1)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify</title>
</head>

<body>
  <div id="app">
    <div id="background"><canvas id="draw_background"></canvas></div>
    <div id="devtool">
      <p>调试工具</p>
      <div id="offset-debug" style="padding:0 12px 12px;font:14px/1.8 system-ui">
        <div>Wallpaper 歌词轴偏移：<span id="offset-wallpaper">0 ms</span></div>
        <div>点击时间临时偏移：<span id="offset-temporary">0 ms</span></div>
        <div>实际总偏移：<span id="offset-total">0 ms</span></div>
        <div>点击已播放时间：−500 ms；点击剩余时间：+500 ms；点击专辑：清零临时偏移。</div>
        <div>正值：歌词提前；负值：歌词延后。</div>
      </div>
      <canvas id="music_bar" height="600" width="800"></canvas>
    </div>
    <div id="container">

      <div id="cover-card">
        <div class="cover-card__rotor">
          <button id="cover" type="button" aria-label="翻转封面，搜索匹配歌词" aria-expanded="false" aria-controls="lyric-search">
            <span class="cover-card__hint">⌕ 匹配歌词</span>
          </button>
          <section id="lyric-search" class="cover-card__back" aria-label="搜索匹配歌词" aria-hidden="true" inert>
            <header class="lyric-search__header">
              <div><span class="lyric-search__eyebrow">LYRIC MATCH</span><h2>找到正在唱的版本</h2></div>
              <button type="button" data-search-close aria-label="返回封面" title="返回封面">↩</button>
            </header>
            <div class="lyric-search__modes" role="group" aria-label="搜索方式">
              <button type="button" data-search-mode="song" aria-pressed="false">歌名</button>
              <button type="button" data-search-mode="artist" aria-pressed="true">歌名＋歌手</button>
            </div>
            <form class="lyric-search__form" data-search-form>
              <input data-search-title type="text" aria-label="搜索歌名" placeholder="歌名" maxlength="200" required autocomplete="off">
              <input data-search-artist type="text" aria-label="搜索歌手" placeholder="歌手" maxlength="200" autocomplete="off">
              <button type="submit" aria-label="搜索歌曲" title="搜索">⌕</button>
            </form>
            <div class="lyric-search__matches">
              <div class="lyric-search__results" data-search-results aria-label="匹配歌曲"></div>
              <nav class="lyric-search__pages" aria-label="搜索结果翻页">
                <button type="button" data-search-prev aria-label="上一页" title="上一页" disabled>↑</button>
                <span data-search-page aria-label="当前页码">—</span>
                <button type="button" data-search-next aria-label="下一页" title="下一页" disabled>↓</button>
              </nav>
            </div>
            <p class="lyric-search__status" data-search-status role="status" aria-live="polite">搜索后，点击歌曲匹配歌词</p>
          </section>
        </div>
      </div>
      <div id="data_container">
        <p id="name">name</p>
        <p id="artist">artist</p>
        <p id="album">album</p>

        <div id="progress_group">
          <!-- <input type="range" id="progress" min="0" max="100" value="0" step="0.1" style="width: 100%;" disabled> -->
          <div id="progress">
            <div id="progress_bar">

            </div>
          </div>
          <div id="start">0:00</div>
          <div id="end">-0:00</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/bootstrap.ts"></script>

</body>

</html>
